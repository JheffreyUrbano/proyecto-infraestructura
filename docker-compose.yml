services:
  postgres:
    image: postgres:15-alpine
    container_name: ferreteria-postgres
    environment:
      POSTGRES_DB: ferreteria_db
      POSTGRES_USER: ferreteria_user
      POSTGRES_PASSWORD: ferreteria_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - ferreteria_net
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: ferreteria-backend
    environment:
      DB_HOST: postgres
      DB_USER: ferreteria_user
      DB_PASSWORD: ferreteria_pass
      DB_NAME: ferreteria_db
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    networks:
      - ferreteria_net
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: ferreteria-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - ferreteria_net
    restart: unless-stopped

networks:
  ferreteria_net:
    driver: bridge

volumes:
  postgres_data:
